[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send any unmatched path back to index.html so deep
# links and refreshes don't 404. There's no client-side router today,
# but every section is reached by in-page anchors, so this only ever
# catches a stray direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
